appId: ua.vtfk.lab_layout
---
# Застосунок холодно стартує без збоїв
- launchApp:
    clearState: true

# Головний екран завантажився: іконка нотаток доступна (tooltip)
- assertVisible: "Нотатки"

# Іконка нотаток відкриває випадне меню
- tapOn: "Нотатки"

# У меню є пункт додавання нотатки, він відкриває діалог
- tapOn: "Нова нотатка"

# У діалозі є поле вводу з підказкою
- tapOn: "Нова нотатка"

# Поле приймає текст
- inputText: "Купити сіль"

# Кнопка «Зберегти» доступна і закриває діалог
- tapOn: "Зберегти"

# Після збереження меню нотаток показує доданий текст
- tapOn: "Нотатки"
- assertVisible: "Купити сіль"
